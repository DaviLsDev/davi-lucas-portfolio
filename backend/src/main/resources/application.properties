# Nome do projeto backend
spring.application.name=rpg-organizer

# URL de conexão: Cria um banco de dados em memória chamado "rpgdb"
spring.datasource.url=jdbc:h2:mem:rpgdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o Console Web do H2 para você visualizar as tabelas pelo navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurações do Hibernate para criar/atualizar as tabelas automaticamente
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Mostra no terminal os comandos SQL que o Spring executar (ótimo para estudar!)
spring.jpa.show-sql=true